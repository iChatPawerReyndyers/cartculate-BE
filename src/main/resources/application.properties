spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Required for data.sql (mock data seed) to run automatically on startup,
# and to run AFTER Hibernate creates the schema (ddl-auto=update above).
# Remove/set to never once you connect to a real, non-empty database.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# data.sql is a single PL/pgSQL DO $$ ... $$ block containing internal
# semicolons. Spring's default ";" script splitter would slice through it
# mid-statement, so this custom separator forces the whole block to run as
# one statement. Matches the "@@" marker at the end of data.sql.
spring.sql.init.separator=@@

server.port=8888